# ============================================================================================================
#  RealmQuest  -  ARCHER
#  A hero class. Its skills are in [skills] at the bottom; numbers every class shares are in hero.toml.
#
#  Change a number and save (no restart). Delete a line (or this file) and the game uses its built-in
#  default. A mistake never crashes the game: the bad line is ignored and a warning is printed in the console.
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the hero loses.
# ============================================================================================================

name = "Archer"                           # Shown on the class card and the HUD.
hp = 100                                  # Base health (levels, armour and quest rewards add to it).
speed = 1.12                              # Walk speed multiplier (1.0 = normal).
dmg_bonus = 0                             # Extra damage on every basic attack (on top of hero.toml sword_damage).
swing_cd = 0.5                            # Seconds between basic attacks (gear Attack Speed and Agility make it shorter).
weapon = "Bow"                            # What the basic attack is called on the HUD.
energy_on_hit = 5.0                       # Energy gained per basic attack that lands (a swing that hits, an arrow that hits).

# The basic attack: cost (mana per bolt), speed and range (pixels), release (0-1: how far into the attack
# animation the shot leaves).
[attack]
speed = 760
range = 620
release = 0.3

# Resource bars: name = [maximum, refill per second]. Stamina pays for dashes; skills cost mana or energy.
[bars]
stamina = [110, 22.4]
energy = [100, 5.0]

# Each skill: [cost, cooldown in seconds]. The cost is paid in the class's skill resource (mana or energy).
[skills]
arrow_volley = [20, 2.2]
piercing_shot = [30, 5.0]
rain_of_arrows = [60, 25.0]
