# ============================================================================================================
#  RealmQuest  -  ORC WARRIOR
#  Berserker Dungeon regular: winds up its axe and slashes in front of it.
#
#  Change a number and save (no restart). Delete a line (or this file) and the game uses its built-in
#  default. A mistake never crashes the game: the bad line is ignored and a warning is printed in the console.
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the hero loses.
# ============================================================================================================

name = "Orc Warrior"                      # Name shown on its health bar.
hp = 550                                  # Health (the hero's sword does sword_damage + gear per hit, see hero.toml).
speed = 84                                # Walking speed (pixels per second).
damage = 22                               # Health the hero loses per hit (before armour).
color = [110, 150, 70]                    # Placeholder colour (only used if the sprite can't load): [red, green, blue].
radius = 15                               # Hit circle (pixels). Bigger = easier to hit.
reach = 30                                # Pixels past its own hit circle that the axe reaches.
slash_arc = 55                            # Degrees either side of its aim that the slash covers (step behind it to dodge).
cooldown = 0.9                            # Seconds of rest after a slash.
