# ============================================================================================================
#  RealmQuest  -  ELDER TREANT
#  ELITE: a bigger treant guarding the Berserker Dungeon's floor key. Its roots use the treant's numbers.
#
#  Change a number and save (no restart). Delete a line (or this file) and the game uses its built-in
#  default. A mistake never crashes the game: the bad line is ignored and a warning is printed in the console.
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the hero loses.
# ============================================================================================================

name = "Elder Treant"                     # Name shown on its health bar.
hp = 1000                                 # Health (the hero's sword does sword_damage + gear per hit, see hero.toml).
speed = 46                                # Walking speed (pixels per second).
damage = 27                               # Health the hero loses per hit (before armour).
color = [110, 80, 50]                     # Placeholder colour (only used if the sprite can't load): [red, green, blue].
radius = 22                               # Hit circle (pixels). Bigger = easier to hit.
size = 1.3                                # How much bigger it is drawn than a treant.
