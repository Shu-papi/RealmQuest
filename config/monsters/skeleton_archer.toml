# ==========================================================================
#  RealmQuest  -  SKELETON ARCHER
#  A skeleton (src/monsters/). Stats at tier 'normal'; a tier (config/tiers.toml) multiplies them.
#  The Lich King's army, the Lich King Dungeon rooms and the north-road night raid all use it.
#
#  Change a number and save (no restart). Delete a line and the game uses its built-in default.
#  A mistake never crashes the game: the bad line is ignored and a warning is printed in the console.
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the player loses.
# ==========================================================================

# ==========================================================================
# SKELETON ARCHER
# ==========================================================================
max_hp = 370                              # Health at tier 'normal' (a tier multiplies this, see [tiers]).
radius = 13                               # Hit circle (pixels).
speed = 72.0                              # Walking speed (pixels per second).
damage = 24                               # Damage of its main attack (tier 'normal').
xp = 8                                    # Experience it gives.
gold = [1, 5]                             # Gold dropped: [min, max].
loot = [["Bone Dust", 0.5], ["Bone Arrows", 0.3], ["Hooded Cloak Scrap", 0.12]]  # Drops: [item, chance 0-1] pairs.
spawn_time = 0.8                          # Seconds it takes to rise from the ground (can't be hurt meanwhile).
dying_time = 1.25                         # Length of its death animation.
stagger_time = 0.28                       # How long a hit interrupts it.
stagger_cooldown = 1.4                    # After a stagger it shrugs hits off this long (no stun-lock).
strike_time = 0.18                        # Duration of the attack itself.
recover_time = 0.45                       # Seconds it is open for a counter-attack after attacking.
poise = false                             # true = hits never interrupt it.
knockback = 190.0                         # How far a hit pushes it.
knockback_resist = 0.0                    # 0 = normal, 1 = immovable.
preferred = [200, 330]                    # Archer: it likes to stand between these distances from you: [near, far].
shoot_range = [90, 480]                   # Archer: [closest, farthest] distance it will shoot from.
windup_time = 0.5                         # WARNING time before the main attack. Smaller = harder to dodge.
snap_chance = 0.4                         # Archer basic attack: chance (0-1) that a shot is a quick snap shot.
snap_windup = 0.2                         # Archer basic attack: warning time.
snap_speed = 720.0                        # Archer basic attack: arrow speed.
snap_damage = 0.7                         # Archer basic attack: fraction of its normal damage.
snap_cooldown = [0.5, 0.9]                # Archer basic attack: [min, max] seconds before the next shot.
aim_lock = 0.15                           # It stops tracking you this long before attacking. Smaller = harder to dodge.
arrow_speed = 650.0                       # Archer: arrow speed.
cooldown = [0.9, 1.5]                     # Archer: [min, max] seconds between shots.
