# ==========================================================================
#  RealmQuest  -  SKELETON WARRIOR
#  A skeleton (src/monsters/). Stats at tier 'normal'; a tier (config/tiers.toml) multiplies them.
#  The Lich King's army, the Lich King Dungeon rooms and the north-road night raid all use it.
#
#  Change a number and save (no restart). Delete a line and the game uses its built-in default.
#  A mistake never crashes the game: the bad line is ignored and a warning is printed in the console.
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the player loses.
# ==========================================================================

# ==========================================================================
# SKELETON WARRIOR
# ==========================================================================
max_hp = 410                              # Health at tier 'normal' (a tier multiplies this, see [tiers]).
radius = 16                               # Hit circle (pixels).
speed = 95.0                              # Walking speed (pixels per second).
damage = 24                               # Damage of its main attack (tier 'normal').
xp = 6                                    # Experience it gives.
gold = [1, 5]                             # Gold dropped: [min, max].
loot = [["Bone Dust", 0.55], ["Rusty Sword", 0.06], ["Dented Shield", 0.05]]  # Drops: [item, chance 0-1] pairs.
spawn_time = 0.8                          # Seconds it takes to rise from the ground (can't be hurt meanwhile).
dying_time = 1.25                         # Length of its death animation.
stagger_time = 0.28                       # How long a hit interrupts it.
stagger_cooldown = 1.4                    # After a stagger it shrugs hits off this long (no stun-lock).
strike_time = 0.2                         # Duration of the attack itself.
recover_time = 0.5                        # Seconds it is open for a counter-attack after attacking.
poise = false                             # true = hits never interrupt it.
knockback = 190.0                         # How far a hit pushes it.
knockback_resist = 0.0                    # 0 = normal, 1 = immovable.
windup_time = 0.32                        # WARNING time before the main attack. Smaller = harder to dodge.
lunge_speed = 540.0                       # Warrior: speed of the lunge.
attack_range = 58                         # Starts its main attack from this far away.
attack_cooldown = 0.9                     # Seconds between main attacks.
slash_range = 22                          # Warrior basic attack: starts when you are this close.
slash_windup = 0.14                       # Warrior basic attack: warning time.
slash_strike = 0.12                       # Warrior basic attack: duration.
slash_recover = 0.3                       # Warrior basic attack: recovery.
slash_lunge = 260.0                       # Warrior basic attack: hop speed.
slash_damage = 0.65                       # Warrior basic attack: fraction of its normal damage.
slash_cooldown = 0.55                     # Warrior basic attack: seconds between slashes.
aim_lock = 0.12                           # It stops tracking you this long before attacking. Smaller = harder to dodge.
