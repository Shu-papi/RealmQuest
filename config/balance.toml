# ==========================================================================
#  RealmQuest  -  BALANCE CONFIG   (the Lich King, the minions, everything)
# ==========================================================================
#  Change a number, save, restart the game. That's it.
#
#   * Lines starting with # are notes. Anything after a # on a line is a note too.
#   * Keep the format:   name = value       (text goes in "quotes", lists in [brackets])
#   * Delete a line and the game uses its built-in default for it.
#   * A mistake never crashes the game: the bad line is ignored and a warning is
#     printed in the console, e.g.  [RealmQuest balance] [boss.phase3] 'combo' ...
#   * Want a quick reset? Run  python tools/make_balance_config.py --force
#
#  Times are in SECONDS, distances in PIXELS, "damage" is the health the player loses.
#  Handy tuning knobs:
#     make the boss tankier ........ [boss]         max_hp
#     make attacks spammier ........ [boss.phaseN]  idle, recover, combo, *_windup
#     make attacks easier to dodge . [boss.timing]   aim_lock      [boss.phaseN] *_windup
#     make the minions tougher ..... [tiers.*]       hp_scale / damage_scale   (his army: [boss.summons] tier)
#     tweak ONE monster ............ [monsters.skeleton_warrior] (and the others)
# ==========================================================================

# ##########################################################################
#   THE LICH KING
# ##########################################################################

# ==========================================================================
# WHO HE IS
# ==========================================================================
[boss]
name = "Lich King"                        # Shown above his health bar.
max_hp = 3000                             # Health pool. Phase 2 starts at phase_2_at of this, phase 3 at phase_3_at.
radius = 44                               # His hit circle (pixels). Bigger = easier to hit.
intro = "Cold air fills the crypt. The Lich King rises from his throne."  # Line shown when the fight starts.
death_line = "The Lich King shatters into dust. 'Death is only the beginning...'"  # Line shown when he dies.
loot = ["Crown of Bones", "Staff of Shadows", "150 Gold"]  # Items he drops, as a list of text.

# ==========================================================================
# PHASES AND TIMING (seconds)
# ==========================================================================
[boss.timing]
phase_2_at = 0.5                          # Phase 2 begins when his HP drops to this fraction (0.5 = 50%).
phase_3_at = 0.25                         # Phase 3 (Last Stand) begins at this fraction.
intro_time = 2.0                          # He rises from the floor and can't be hurt for this long.
transition_time = 1.8                     # The roar between phases (can't be hurt).
teleport_time = 0.35                      # Fade-out time of a teleport (and fade-in again).
dying_time = 2.0                          # Length of his death animation.
aim_lock = 0.3                            # Volley and Barrage stop tracking you this long before firing. Bigger = easier to dodge.
combo_pause = 1.00                        # Pause between the attacks of one chain. Smaller = more overwhelming.

# ==========================================================================
# THE PLAYER'S WINDOW (after every chain he is exhausted)
# ==========================================================================
[boss.window]
exhaust_bonus = 1.5                       # Damage multiplier while he is exhausted or stunned (1.5 = +50%).

# ==========================================================================
# PHASE 3: THE SOUL WARD (invulnerable while any summon lives)
# ==========================================================================
[boss.ward]
shield_break_window = 2.0                 # Seconds he is STUNNED (and takes bonus damage) after the last summon dies.
rearm_after = 7.0                         # Seconds with no army before he calls a fresh wave.
wave_raise_budget = 2                     # Dead an acolyte may raise per wave (so the ward can't last forever).

# ==========================================================================
# ATTACK DAMAGE (health the player loses per hit)
# ==========================================================================
[boss.damage]
volley_damage = 12                        # One bolt of the Shadow Volley.
drain_damage = 18                         # Life Drain circle (it also heals him; see drain_heal in the phases).
nova_damage = 10                          # One bone shard of the Bone Nova.
grasp_damage = 12                         # A Grasping Hand.
barrage_damage = 9                        # One bolt of the Soul Barrage.
rain_damage = 14                          # One Soul Rain circle.

# ==========================================================================
# ATTACK SHAPES (pixels / counts)
# ==========================================================================
[boss.shapes]
drain_radius = 85                         # Size of a Life Drain circle.
grasp_radius = 42                         # Size of a Grasping Hand.
volley_spread_deg = 16.0                  # Angle between the bolts of a Shadow Volley (degrees).
nova_gap_shards = 3                       # How many shards wide the Bone Nova's safe gap is. Smaller = harder.
nova_second_ring = 0.55                   # Seconds between the two rings of the phase 3 nova.
rain_stagger = 0.1                        # Seconds between one Soul Rain circle bursting and the next.
grasp_stagger = 0.12                      # Seconds between one Grasping Hand bursting and the next.

# ==========================================================================
# COLOURS (red, green, blue: 0-255)
# ==========================================================================
[boss.colors]
exhaust_glow = [255, 214, 120]            # 'Hit me now' gold.
shield = [176, 150, 255]                  # The Soul Ward violet.
shield_hot = [236, 226, 255]              # The Soul Ward highlight.

[boss.colors.attack_glow]   # The glow colour of each attack's wind-up.
volley = [239, 159, 39]
drain = [151, 196, 89]
summon = [212, 83, 126]
nova = [110, 200, 255]
grasp = [176, 110, 235]
barrage = [255, 110, 90]
rain = [90, 220, 190]

